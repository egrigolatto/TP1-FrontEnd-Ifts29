<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Grupo 28 | Menú Principal</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@400;500;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="global.css" />
	</head>
	<body>
		<main class="page-shell">
			<header class="page-header">
				<p class="kicker">RPG MAKER MZ STYLE</p>
				<h1>Grupo 28 - Menu de Equipo</h1>
				<p class="subtitle">
					Selecciona una categoria en el menu lateral y luego un integrante para abrir su ficha.
				</p>
			</header>

			<section class="rpg-layout" aria-label="Menu principal de integrantes">
				<div class="window panel-main" id="party-panel" aria-live="polite"></div>

				<aside class="window panel-menu" aria-label="Categorias">
					<h2 class="window-title">Menu</h2>
					<div class="menu-buttons" id="category-menu"></div>
					<p class="helper-text" id="menu-hint">
						Elige una categoria para habilitar la seleccion de personaje.
					</p>
				</aside>
			</section>
		</main>

		<script defer src="js/mock-data.js"></script>
		<script defer src="js/ui-components.js"></script>
		<script defer src="js/index-page.js"></script>
		<script defer src="portada.js"></script>
	</body>
</html>
